<!DOCTYPE html>
<html>
<head><title>Upload Test</title></head>
<body style="background:#222;color:#fff;font-family:sans-serif;padding:40px;">
  <h1>File Picker Test</h1>
  <p>Click the button below. If the file dialog opens, the tunnel works fine.</p>
  <br>
  <input type="file" accept=".wav,.mp3,.mp4,.mov" style="font-size:18px;">
  <br><br>
  <button onclick="document.querySelector('input[type=file]').click()" style="font-size:18px;padding:10px 20px;">
    JS-triggered file picker
  </button>
</body>
</html>
